<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow - Personal Task Manager</title>

  <!-- Bootstrap, Icons, AOS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">


  <!-- App styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-bg">
  <main class="auth-center">
    <div class="card auth-card shadow-lg" data-aos="fade-up">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <h3 class="mb-0">
            <i class="bi bi-list-check me-2"></i>TaskFlow
          </h3>
          <small class="text-muted">Create your demo account for IMS566</small>
        </div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Full name</label>
            <input id="name" type="text" class="form-control" placeholder="Your name" required>
            <div class="invalid-feedback">Name is required.</div>
          </div>

          <div class="mb-3">
            <label for="regEmail" class="form-label">Email</label>
            <input id="regEmail" type="email" class="form-control" placeholder="you@example.com" required>
            <div class="invalid-feedback">Valid email is required.</div>
          </div>

          <div class="mb-3">
            <label for="regPassword" class="form-label">Password</label>
            <div class="input-group">
              <input id="regPassword" type="password" class="form-control" placeholder="Choose a password" required>
              <button id="toggleRegPw" class="btn btn-outline-secondary" type="button">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="invalid-feedback">Password is required.</div>
            <div class="form-text small">
              This registers a demo account stored in your browser only.
            </div>
          </div>

          <div id="registerAlert" class="alert alert-danger d-none" role="alert"></div>
          <div id="registerSuccess" class="alert alert-success d-none" role="alert"></div>

          <div class="d-grid mt-3">
            <button class="btn btn-success btn-lg" type="submit">
              <i class="bi bi-person-plus me-2"></i>Register
            </button>
          </div>

          <div class="mt-3 small text-center">
            <a href="login.html">Back to login</a>
          </div>
        </form>
      </div>

      <footer class="auth-footer text-center small text-muted mt-3 pb-3">
        <span id="year"></span> TaskFlow - IMS566 Personal Task Manager
      </footer>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>

  <script src="script.js"></script>
  <script>
    // Footer year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Toggle register password visibility
    document.getElementById('toggleRegPw').addEventListener('click', function (event) {
      const pw = document.getElementById('regPassword');
      const icon = event.currentTarget.querySelector('i');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pw.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    // Register form handler
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const emailInput = document.getElementById('regEmail').value.trim();
      const email = emailInput.toLowerCase();
      const pw = document.getElementById('regPassword').value;

      const alertBox = document.getElementById('registerAlert');
      const successBox = document.getElementById('registerSuccess');
      alertBox.classList.add('d-none');
      successBox.classList.add('d-none');

      if (!name || !email || !pw) {
        alertBox.textContent = 'Please fill in all fields.';
        alertBox.classList.remove('d-none');
        return;
      }

      // Store as demo account for this browser
      const demoAcc = { name, email, password: pw };
      localStorage.setItem('tm_demoaccount', JSON.stringify(demoAcc));

      // Initialise profile for this user with empty bio
      const profile = {
        name,
        email: emailInput,
        bio: '',
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300&q=60&auto=format&fit=crop'
      };
      localStorage.setItem('tm_profile', JSON.stringify(profile));
      localStorage.setItem('tm_avatar', profile.avatar);

      successBox.textContent = 'Account created. You can now log in using this email and password.';
      successBox.classList.remove('d-none');

      // Redirect to login after short delay
      setTimeout(function(){
        window.location.href = 'login.html';
      }, 1200);
    });
  </script>
</body>
</html>
