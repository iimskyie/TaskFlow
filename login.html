<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow - Personal Task Manager</title>

  <!-- Bootstrap, Icons, AOS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- App styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-bg">
  <main class="auth-center">
    <div class="card auth-card shadow-lg" data-aos="zoom-in">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <h3 class="mb-0">
            <i class="bi bi-list-check me-2"></i>TaskFlow
          </h3>
          <small class="text-muted">Personal Task Manager for IMS566</small>
        </div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" placeholder="you@example.com" required>
            <div class="invalid-feedback">Enter a valid email.</div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <input id="password" type="password" class="form-control" placeholder="Your password" required>
              <button id="togglePw" class="btn btn-outline-secondary" type="button" title="Show / hide">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="form-text">
              Demo login:<br>
              <strong>nmuhd0033@gmail.com</strong> / <strong>Naim.0033</strong>
            </div>
          </div>

          <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

          <div class="d-grid mt-3">
            <button class="btn btn-primary btn-lg" type="submit">
              <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <small>
              <a href="register.html">Create account</a>
            </small>
            <a href="#" id="demoFill" class="small">Autofill demo</a>
          </div>
        </form>
      </div>

      <footer class="auth-footer text-center small text-muted mt-3 pb-3">
        <span id="year"></span> TaskFlow - IMS566 Personal Task Manager
      </footer>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>

  <script src="script.js"></script>
  <script>
    // Footer year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Fixed demo user
    const DEMOUSER = {
      email: 'nmuhd0033@gmail.com',
      password: 'Naim.0033',
      name: 'Muhammad Naim Sazali'
    };

    // Toggle password visibility
    document.getElementById('togglePw').addEventListener('click', function (event) {
      const pw = document.getElementById('password');
      const icon = event.currentTarget.querySelector('i');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pw.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    // Autofill demo credentials
    document.getElementById('demoFill').addEventListener('click', function (e) {
      e.preventDefault();
      document.getElementById('email').value = DEMOUSER.email;
      document.getElementById('password').value = DEMOUSER.password;
    });

    // Login submit handler
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const emailInput = document.getElementById('email').value.trim();
      const email = emailInput.toLowerCase();
      const pw = document.getElementById('password').value;

      const alertBox = document.getElementById('loginAlert');
      alertBox.classList.add('d-none');

      // Registered demo account from register.html
      const reg = JSON.parse(localStorage.getItem('tm_demoaccount') || 'null');

      let valid = false;
      let name = '';

      if (reg && reg.email && reg.password &&
          email === reg.email.toLowerCase() && pw === reg.password) {
        valid = true;
        name = reg.name || reg.email;
      } else if (email === DEMOUSER.email.toLowerCase() && pw === DEMOUSER.password) {
        valid = true;
        name = DEMOUSER.name;
      }

      if (valid) {
        const isDemoFixed =
          (email === DEMOUSER.email.toLowerCase() && pw === DEMOUSER.password);

        if (isDemoFixed) {
          // Only for fixed demo: reset and preload sample data
          localStorage.removeItem('tm_tasks');
          localStorage.removeItem('tm_projects');
          initDemoData();
        }
        // Registered users: do NOT clear tasks/projects here,
        // so their data persists across logins.

        // Save session user (for header/profile)
        localStorage.setItem('tm_user', JSON.stringify({ email: emailInput, name }));

        window.location.href = 'dashboard.html';
      } else {
        alertBox.textContent =
          'Invalid login. Use the demo credentials or register a demo account.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
