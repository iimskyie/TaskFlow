<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow - Personal Task Manager</title>

  <!-- Bootstrap, Icons, AOS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">


  <!-- App styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar d-none d-lg-flex flex-column" id="sidebar">
    <div class="sidebar-brand mb-4">
      <h4 class="mb-0">
        <i class="bi bi-list-check me-2"></i>TaskFlow
      </h4>
    </div>
    <nav>
      <a href="dashboard.html">
        <i class="bi bi-speedometer2 me-2"></i>Dashboard
      </a>
      <a href="tasks.html">
        <i class="bi bi-card-checklist me-2"></i>Tasks
      </a>
      <a href="projects.html" class="active">
        <i class="bi bi-folder me-2"></i>Projects
      </a>
      <a href="profile.html">
        <i class="bi bi-person-circle me-2"></i>Profile
      </a>
    </nav>
    <div class="sidebar-footer mt-auto pt-3">
      <button id="darkToggle" class="btn btn-sm btn-light w-100 mb-2">
        <i class="bi bi-moon-stars me-2"></i>Dark mode
      </button>
      <button id="logoutBtnSide" class="btn btn-sm btn-outline-light w-100">
        <i class="bi bi-box-arrow-right me-2"></i>Logout
      </button>
    </div>
  </aside>

  <!-- Topbar for mobile -->
  <nav class="navbar topbar d-lg-none navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">
        <i class="bi bi-list-check me-2"></i>TaskFlow
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mobileNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mobileNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="tasks.html">Tasks</a></li>
          <li class="nav-item"><a class="nav-link active" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <button id="darkToggleMobile" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-moon-stars"></i>
          </button>
          <button id="logoutBtnTop" class="btn btn-sm btn-outline-danger">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <div class="content">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 data-aos="fade-right" class="mb-1">Projects</h2>
          <p class="text-muted mb-0">Manage your assignment projects in TaskFlow.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#projectModal" onclick="document.getElementById('projectForm').reset(); document.getElementById('projectId').value=''; document.getElementById('projectModalTitle').textContent='New Project';">
          <i class="bi bi-plus-circle me-2"></i>New project
        </button>
      </div>

      <div class="row g-3" id="projectsContainer">
        <!-- Filled by renderProjectsList() -->
      </div>

      <!-- Footer -->
      <footer class="footer-bar text-center small mt-4">
        <span id="year2"></span> TaskFlow - IMS566 Personal Task Manager
      </footer>
    </div>
  </div>

  <!-- Project Modal -->
  <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="projectForm">
        <div class="modal-header">
          <h5 class="modal-title" id="projectModalTitle">New Project</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="projectId">
          <div class="mb-3">
            <label for="projectName" class="form-label">Project name</label>
            <input type="text" id="projectName" class="form-control" placeholder="e.g. IMS566 Individual Assignment" required>
          </div>
          <div class="mb-3">
            <label for="projectDesc" class="form-label">Description</label>
            <textarea id="projectDesc" class="form-control" rows="3" placeholder="Short description of this assignment or project"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-save me-1"></i>Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ once: true });
  </script>

  <script src="script.js"></script>
  <script>
    // Footer year
    document.getElementById('year2').textContent = new Date().getFullYear();

    // Logout
    const logoutSide = document.getElementById('logoutBtnSide');
    const logoutTop = document.getElementById('logoutBtnTop');
    function doLogout(){
      localStorage.removeItem('tm_user');
      window.location.href = 'login.html';
    }
    if (logoutSide) logoutSide.addEventListener('click', doLogout);
    if (logoutTop) logoutTop.addEventListener('click', doLogout);

    // Initial app setup (dark mode, demo data, render projects)
    initialPageSetup();

    // Hook mobile dark mode to same toggle
    const darkToggleMobile = document.getElementById('darkToggleMobile');
    if (darkToggleMobile && typeof toggleDarkMode === 'function'){
      darkToggleMobile.addEventListener('click', toggleDarkMode);
    }
  </script>
</body>
</html>
